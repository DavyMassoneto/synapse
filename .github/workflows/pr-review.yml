name: PR review bots

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: ${{ matrix.bot }}
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["DavyMassoneto","rafaeleduardo381","SergioTavares278"]'), github.event.pull_request.user.login)
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}-${{ matrix.bot }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bot: [srp, clean-code, yagni, dry, architecture, quality, standards]
    steps:
      - uses: actions/checkout@v4
      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: https://omniroute.dmassoneto.com.br/v1
          REVIEW_MODEL: cc/claude-sonnet-5-5
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BOT: ${{ matrix.bot }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/pr-review/review.py

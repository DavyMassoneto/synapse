name: PR evaluator

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-evaluator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Buscar a cabeça da PR como dado
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head"
      - name: Avaliar
        run: npm run evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: https://omniroute.dmassoneto.com.br/v1
          REVIEW_MODEL: cc/claude-sonnet-5-5
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
